<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
<title>MyDairy — Watch • Track • Remember</title>
<meta name="description" content="MyDairy: track movies, series and anime, pick up where you left off, and ask Jarvis AI what to watch next.">
<meta name="theme-color" content="#0b0720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyDairy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
<div class="aurora" aria-hidden="true"></div>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/home"><img src="icons/icon.svg" alt="" width="46" height="46"><span><b>MyDairy</b><small>Watch • Track • Remember</small></span></a>
    <nav id="nav" aria-label="Main"></nav>
    <hr>
    <nav id="nav2" aria-label="Account"></nav>
    <div class="prem"><span id="premIc"></span><div><b>Premium themes</b><small>Pick your own accent colour</small></div><button class="btn p sm" data-do="accent">Explore themes</button></div>
    <p class="ver">v3.0.0 • Made with <span class="hrt">♥</span></p>
  </aside>
  <main class="main">
    <header class="top">
      <button class="ib burger" id="burger" aria-label="Menu"></button>
      <label class="search"><span id="sIc"></span><input id="q" type="search" placeholder="Search movies, series, anime…  ( / )" autocomplete="off"></label>
      <button class="btn sm" id="addBtn" hidden></button>
      <button class="btn p install" id="install" hidden><span id="inIc"></span>Install App<i id="inX" role="button" aria-label="Hide">×</i></button>
      <button class="tg" id="theme" aria-label="Switch theme"><span id="sunIc"></span><s></s><span id="moonIc"></span></button>
      <button class="ib bell" id="bell" aria-label="Notifications"><span id="bellIc"></span><em id="bellN">3</em></button>
      <button class="av" id="avatar" aria-label="Profile"></button>
    </header>
    <nav class="tabs" id="tabs" aria-label="Browse"></nav>
    <div id="view" aria-live="polite"></div>
  </main>
  <aside class="rail">
    <section class="box" id="cont"></section>
    <section class="box" id="stats"></section>
    <section class="jv" id="jarvis"></section>
  </aside>
</div>
<button class="fab" id="fab" aria-label="Open Jarvis AI"></button>
<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/jarvis.js"></script>
<script src="js/cloud.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
