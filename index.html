/* =========================================================================
   ΣTΣЯПITY — app.css
   Same family as PayMate: indigo · teal · amber, iPhone-style liquid glass on the header, dock and windows,
   solid readable cards everywhere else. Dark is the default (posters look best), light is one tap away.
   ========================================================================= */
:root {
  --font-ui: "ET Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --ink: #1b1f3b; --ink-2: #3d4263; --mute: #6a7090; --line: #e3e6f5; --line-2: #eff1fb;
  --card: #ffffff; --card-2: #f3f4ff; --field: #ffffff;
  --acc: #4f46e5; --acc-2: #7c6cf7; --acc-d: #3730a3; --acc-soft: #eef0ff;
  --teal: #14b8a6; --amber: #f5a524; --amber-soft: #fff0d0; --coral: #ef5b4a; --coral-soft: #fde6e2; --green: #12a36b; --green-soft: #dcf6ea;
  --st-watched: #22c55e; --st-watching: #38bdf8; --st-will: #f5a524; --st-hold: #a78bfa; --st-never: #ef5b4a;
  --r-xl: 26px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --sh-1: 0 1px 2px rgba(31, 35, 90, .06), 0 8px 24px rgba(31, 35, 90, .08);
  --sh-2: 0 2px 6px rgba(31, 35, 90, .08), 0 20px 48px rgba(31, 35, 90, .18);
  --glass: rgba(255, 255, 255, .56); --glass-strong: rgba(255, 255, 255, .86); --glass-line: rgba(255, 255, 255, .78); --glass-hi: rgba(255, 255, 255, .95);
  --bg-base: #eef0ff; --scrim: rgba(14, 16, 48, .5);
  --wm-a: #4f46e5; --wm-b: #0d9488;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
[data-theme="dark"] {
  --ink: #eceeff; --ink-2: #c5c9ee; --mute: #9aa1d0; --line: #2a2f63; --line-2: #222657;
  --card: #151839; --card-2: #1c2048; --field: #0f1232;
  --acc: #7b72ff; --acc-2: #9a8cff; --acc-d: #b9b3ff; --acc-soft: #262b66;
  --amber-soft: #3d2d0c; --coral-soft: #4a1f27; --green-soft: #0f3a2b;
  --glass: rgba(26, 29, 70, .55); --glass-strong: rgba(20, 23, 58, .88); --glass-line: rgba(255, 255, 255, .14); --glass-hi: rgba(255, 255, 255, .18);
  --sh-1: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --sh-2: 0 2px 6px rgba(0, 0, 0, .5), 0 20px 48px rgba(0, 0, 0, .55);
  --bg-base: #0b0d27; --scrim: rgba(4, 5, 20, .66);
  --wm-a: #b3adff; --wm-b: #5eead4;
  color-scheme: dark;
}

/* ------------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; font-family: var(--font-ui); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg-base);
  -webkit-font-smoothing: antialiased; overflow-x: hidden; -webkit-tap-highlight-color: transparent; padding-bottom: calc(96px + var(--safe-b));
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(900px 620px at 6% -6%, rgba(79, 70, 229, .26), transparent 62%), radial-gradient(820px 600px at 100% 2%, rgba(20, 184, 166, .22), transparent 62%), radial-gradient(1000px 720px at 55% 112%, rgba(245, 165, 36, .2), transparent 62%);
}
[data-theme="dark"] body::before {
  background: radial-gradient(900px 620px at 6% -6%, rgba(99, 88, 255, .32), transparent 62%), radial-gradient(820px 600px at 100% 2%, rgba(20, 184, 166, .2), transparent 62%), radial-gradient(1000px 720px at 55% 112%, rgba(245, 165, 36, .11), transparent 62%);
}
h1, h2, h3, h4, p { margin: 0; }
h2, h3, h4 { letter-spacing: -.2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--acc-2); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 400; background: var(--acc); color: #fff; padding: 10px 14px; border-radius: 12px; text-decoration: none; }
.skip-link:focus { top: 10px; }
.noscript { padding: 20px; text-align: center; background: var(--amber-soft); }
.honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.center { text-align: center; }
.hint { font-size: .8rem; color: var(--mute); margin-top: 6px; }
.opt { font-weight: 400; color: var(--mute); font-size: .78rem; }
.link { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
code { font: 600 .82em ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 6px; border-radius: 6px; background: var(--card-2); }
kbd { font: 600 .78rem var(--font-ui); padding: 2px 8px; border-radius: 6px; background: var(--card-2); border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 14px 14px 0; }

/* ------------------------------------------------------------- liquid glass */
.glass {
  background: linear-gradient(135deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, .08) 46%, rgba(255, 255, 255, .26)), var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-line); box-shadow: var(--sh-2), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(255, 255, 255, .14);
}
[data-theme="dark"] .glass { background: linear-gradient(135deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, 0) 46%, rgba(255, 255, 255, .05)), var(--glass); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--glass-strong); } }

/* ----------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 0; border-radius: 15px; font-weight: 600; font-size: .92rem;
  text-decoration: none; line-height: 1.1; white-space: nowrap; user-select: none; transition: transform .15s ease, box-shadow .2s ease, background .2s ease, opacity .2s ease; -webkit-appearance: none; appearance: none;
}
.btn:hover { transform: translateY(-1px); } .btn:active { transform: scale(.97); } .btn[disabled] { opacity: .5; pointer-events: none; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: .84rem; border-radius: 12px; } .btn-block { width: 100%; }
.btn-primary { color: #fff; background: linear-gradient(135deg, #4f46e5, #7c5cf5); box-shadow: 0 6px 16px rgba(79, 70, 229, .38), inset 0 1px 0 rgba(255, 255, 255, .3); }
.btn-accent { color: #3a2400; background: linear-gradient(135deg, #ffbf3c, #f59e0b); box-shadow: 0 6px 16px rgba(245, 158, 11, .38), inset 0 1px 0 rgba(255, 255, 255, .5); }
.btn-soft { color: var(--acc); background: var(--acc-soft); } [data-theme="dark"] .btn-soft { color: #d4d0ff; }
.btn-ghost { color: var(--ink-2); background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-danger { color: #fff; background: linear-gradient(135deg, #f0624f, #d93a29); box-shadow: 0 6px 14px rgba(217, 58, 41, .3); }
.btn-danger.btn-ghost { color: var(--coral); background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--coral) 50%, transparent); }
.btn-icon { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 50%; font-size: 1.1rem; line-height: 1; background: var(--glass-strong); color: var(--ink); box-shadow: inset 0 0 0 1px var(--glass-line), 0 2px 8px rgba(0, 0, 0, .12); transition: transform .15s ease; }
.btn-icon:hover { transform: scale(1.07); } .btn-icon:active { transform: scale(.93); }
.btn-icon-sm { width: 36px; height: 36px; font-size: .95rem; background: var(--card-2); box-shadow: none; }

/* ------------------------------------------------------------------ fields */
.field { margin: 0 0 14px; }
.field label { display: block; font-weight: 600; font-size: .84rem; margin: 0 0 6px; color: var(--ink-2); }
.field label b { color: var(--acc); font-weight: 700; margin-left: 6px; }
input[type=text], input[type=password], input[type=search], input[type=number], input[type=date], input[type=url], input[type=email], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--field); color: var(--ink); font-size: 16px; -webkit-appearance: none; appearance: none;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%); background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--acc) 22%, transparent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; } @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.form-err { margin: 6px 0 10px; padding: 10px 14px; border-radius: 12px; background: var(--coral-soft); color: var(--coral); font-size: .86rem; font-weight: 500; }
[data-theme="dark"] .form-err { color: #ffb4ab; }
.form-status { min-height: 1.2em; margin: 4px 0 10px; font-size: .86rem; } .form-status.error { color: var(--coral); } .form-status.success { color: var(--green); } .form-status.info { color: var(--mute); }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.key-row { display: flex; gap: 8px; } .key-row input { flex: 1; min-width: 0; }
.stepper { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid var(--line); border-radius: 14px; background: var(--field); min-height: 46px; }

    view.input.addEventListener('input', function () { var el = view.input; el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; });
    h.body.addEventListener('click', function (e) {
      var q = e.target.closest('#jvQuick [data-q]'); if (q) { ask(q.dataset.q); return; }
      var add = e.target.closest('[data-sug]'); if (add) { addToList(+add.dataset.sug, add); return; }
      var op = e.target.closest('[data-open]'); if (op) { ET.detail.open(op.dataset.open); return; }
      if (e.target.closest('#jvClear')) { hist = []; persist(); draw(); e.target.closest('#jvClear').remove(); }
    });
    draw();
    if (prefill) { if (auto) ask(prefill); else { view.input.value = prefill; view.input.focus(); } }
    else setTimeout(function () { if (view) view.input.focus({ preventScroll: true }); }, 120);
  };
})(window.ET = window.ET || {});

  </script>
