    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2354"/><stop offset="1" stop-color="#0f0a26"/></linearGradient>
    <linearGradient id="bodygloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".18"/></linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfa8ff"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#9b6bff" flood-opacity=".35"/></filter>
