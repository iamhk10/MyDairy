    <radialGradient id="gG" cx=".02" cy=".02" r=".75"><stop offset="0" stop-color="#14f0b0" stop-opacity=".55"/><stop offset=".5" stop-color="#14f0b0" stop-opacity=".12"/><stop offset="1" stop-color="#14f0b0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gP" cx=".98" cy=".98" r=".75"><stop offset="0" stop-color="#a855f7" stop-opacity=".75"/><stop offset=".5" stop-color="#8b3df0" stop-opacity=".2"/><stop offset="1" stop-color="#8b3df0" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2cf5c0"/><stop offset=".35" stop-color="#2cf5c0" stop-opacity=".15"/><stop offset=".7" stop-color="#a855f7" stop-opacity=".25"/><stop offset="1" stop-color="#b86cff"/></linearGradient>
